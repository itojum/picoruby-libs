name: Publish to npm

# Runs when a GitHub Release is published. The version is the one in
# package.json; the release's tag must be that version with a "v" prefix
# (package.json 1.2.3 -> tag v1.2.3), or nothing is published.
# To publish a tag again, run this workflow by hand with the tag selected
# under "Use workflow from".

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # npm trusted publishing and provenance
    steps:
      - name: Check the tag
        if: github.ref_type != 'tag'
        run: |
          echo "::error::Run this workflow on a release tag (v1.2.3), not on ${GITHUB_REF_NAME}."
          exit 1

      - uses: actions/checkout@v7

      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(jq -r .version package.json)
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION. Tag the commit that sets the version as v$VERSION."
            exit 1
          fi

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - run: bundle exec rspec

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org

      # npm refuses to publish a prerelease (1.2.3-rc.1) without an explicit
      # dist-tag, so prereleases go to "next" and leave "latest" alone.
      # Build metadata (1.2.3+build-1) is dropped first: a hyphen there does
      # not make a prerelease.
      - name: Publish
        run: |
          VERSION=$(jq -r .version package.json)
          if [[ "${VERSION%%+*}" == *-* ]]; then
            npm publish --provenance --access public --tag next
          else
            npm publish --provenance --access public
          fi
