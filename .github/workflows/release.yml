name: Release

# release-please and npm publish in one workflow, so the default GITHUB_TOKEN
# is enough: a release created with GITHUB_TOKEN does not start other
# workflows, but the publish job here runs right after it.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the version in package.json to npm without a new release"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - run: bundle exec rspec

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm publish --provenance --access public
