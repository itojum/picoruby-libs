<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>picoruby-libs - picodx</title>
  <style>
    body { background: #1a1a1a; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    canvas { border: 1px solid #444; }
  </style>
</head>
<body>
  <canvas id="game" width="640" height="480"></canvas>

  <!-- Required: the loader loads from npm only the names mapped here. -->
  <script type="text/ruby-importmap">
    { "imports": { "picodx": "npm:picodx@2" } }
  </script>

  <!-- The loader resolves requires in text/ruby-app scripts and starts them as PicoRuby tasks. -->
  <script type="text/ruby" src="../../loader.rb"></script>
  <script type="text/ruby-app" src="game.rb"></script>

  <script src="https://cdn.jsdelivr.net/npm/@picoruby/wasm-wasi@latest/dist/init.iife.js"></script>
</body>
</html>
